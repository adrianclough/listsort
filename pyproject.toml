[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "listsort"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["readchar", "rich"]

[project.scripts]

listsort = "listsort.main:main_cli"

[tool.setuptools.packages.find]
include = ["listsort*"]